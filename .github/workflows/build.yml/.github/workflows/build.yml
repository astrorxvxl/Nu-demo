
      - name: Organizar arquivos Android
        run: |
          mkdir -p app/src/main/java/com/example/nubankdemo
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt app/src/main/java/com/example/nubankdemo/MainActivity.kt
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.nubankdemo'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.nubankdemo'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
